  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; color: #E0E6ED; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
    
    #app { display: grid; grid-template-rows: 56px 1fr 60px; grid-template-columns: 1fr; width: 100vw; height: 100vh; position: relative; gap: 6px; padding: 10px 0; box-sizing: border-box; z-index: 2; }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #0a1628 0%, #162447 100%); display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 0 0 2px rgba(0,212,255,0.3), 0 0 16px rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.2); position: relative; overflow: hidden; }

    .logo-text span { background: linear-gradient(90deg, #00D4FF, #7B68EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
    
    
    
    /* 大洲导航条 */
    .continent-nav { display: flex; align-items: center; gap: 2px; margin-left: auto; }
    .nav-link {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      background: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      border-radius: 6px;
    }
    .nav-link:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.04); }
    .nav-link.active { color: #fff; }

    /* 顶栏图标按钮 */

      font-size: 14px;

    }

      border-color: rgba(255,255,255,0.12);
    }

    /* Cesium 地球容器 - 居中显示 */
    #globe-container { 
      grid-row: 2; 
      position: relative; 
      overflow: hidden; 
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0 10px;
    }
    #cesiumContainer { 
      width: 100%; 
      height: 100%; 
      border-radius: 14px;
    }
    
    /* 隐藏 Cesium 默认UI */
    .cesium-viewer-bottom { display: none !important; }
    .cesium-viewer-toolbar { display: none !important; }
    .cesium-viewer-animationContainer { display: none !important; }
    .cesium-viewer-timelineContainer { display: none !important; }
    .cesium-viewer-fullscreenContainer { display: none !important; }
    .cesium-credit-textContainer { display: none !important; }
    .cesium-credit-logoContainer { display: none !important; }
    
    #loading-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,15,28,0.95); z-index: 100; border-radius: 14px; }

    #loading-overlay .error-text { font-size: 12px; color: #ff4d6d; margin-top: 8px; max-width: 300px; text-align: center; }
    
    .panel { 
      background: rgba(5,8,16,0.98); 
      backdrop-filter: blur(16px) saturate(1.2); 
      border: 1px solid rgba(255,255,255,0.04); 
      border-radius: 14px; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      z-index: 1000;
      box-shadow: 4px 0 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
    }
    .panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    .panel > * { position: relative; z-index: 1; }
    /* unified panel - see below */
    
    .tab-bar { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 4px; 
      padding: 10px 12px; 
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .tab-btn { 
      padding: 10px 8px; 
      font-size: 12px; 
      color: rgba(255,255,255,0.35); 
      cursor: pointer; 
      border-radius: 8px; 
      text-align: center; 
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); 
      font-weight: 500;
      letter-spacing: 0.3px;
      position: relative;
    }
    .tab-btn:hover { 
      color: #C8D4E0; 
      background: rgba(255,255,255,0.05); 
    }
    .tab-btn.active { 
      color: #fff; 
      background: rgba(255,255,255,0.06);
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 25%;
      width: 50%;
      height: 2px;
      background: linear-gradient(90deg, #00D4FF, #7B68EE);
      border-radius: 1px;
    }
    
    .panel-section { flex: 1; overflow-y: auto; padding: 8px 10px; scroll-behavior: smooth; }
    .panel-section::-webkit-scrollbar { width: 3px; }
    .panel-section::-webkit-scrollbar-track { background: transparent; }
    .panel-section::-webkit-scrollbar-thumb { 
      background: linear-gradient(180deg, rgba(0,212,255,0.2), rgba(123,104,238,0.2)); 
      border-radius: 3px;
    }
    .panel-section::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, rgba(0,212,255,0.4), rgba(123,104,238,0.4));
    }
    .panel-section { scrollbar-width: thin; scrollbar-color: rgba(0,212,255,0.2) transparent; }
    
    .station-item { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      padding: 10px 12px; 
      background: rgba(255,255,255,0.025); 
      border-radius: 12px; 
      margin-bottom: 4px; 
      cursor: pointer; 
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); 
      border: 1px solid rgba(255,255,255,0.03);
      position: relative;
      overflow: hidden;
    }
    .station-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #00D4FF, #7B68EE);
      border-radius: 0 3px 3px 0;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .station-item:hover { 
      background: rgba(255,255,255,0.06); 
      border-color: rgba(0,212,255,0.12);
      transform: translateX(2px);
    }
    .station-item:hover::before { opacity: 0.5; }
    .station-item.active { 
      background: rgba(0,212,255,0.08);
      border-color: rgba(0,212,255,0.18);
      box-shadow: 0 2px 12px rgba(0,212,255,0.08);
    }
    .station-item.active::before { opacity: 1; animation: slideIndicator 0.3s ease; }
    @keyframes slideIndicator { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .station-item .icon { 
      width: 36px; 
      height: 36px; 
      border-radius: 9px; 
      background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,104,238,0.2));

      align-items: center; 
      justify-content: center; 
      font-size: 16px; 
      flex-shrink: 0;

    }
    .station-item:hover .icon {
      background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(123,104,238,0.3));

    .station-item .info { flex: 1; min-width: 0; }
    .station-item .name { 
      font-size: 13.5px;

      color: #E8EEF4;

    }
    .station-item .meta { 
      font-size: 10.5px; 
      color: rgba(255,255,255,0.35);

      letter-spacing: 0.2px;
    }
    
    .filter-card { 
      margin: 0; 
      padding: 0; 
      background: transparent; 
      border-radius: 0;
    }
    .filter-header-title { 
      font-size: 14px; 
      font-weight: 700; 
      margin-bottom: 0; 
      color: #E8EEF4;
      letter-spacing: 0.3px;
    }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { padding: 6px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; border: 1px solid rgba(255,255,255,0.06); color: #8A99AB; background: rgba(255,255,255,0.04); transition: all 0.3s; }
    .chip:hover { border-color: rgba(0,212,255,0.3); color: #00D4FF; }
    .chip.active { border-color: rgba(0,212,255,0.5); color: #fff; background: linear-gradient(135deg, rgba(0,212,255,0.18), rgba(123,104,238,0.12)); }
    
    .result-count {

      color: #6B7F92;

      margin-top: 6px;
      letter-spacing: 0.2px;
    }
    .result-count strong { 
      color: #00D4FF; 
      font-weight: 700;
      font-size: 13px;
    }
    
    /* 右侧面板头部 - Premium */
    .right-panel-header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.01);

    .station-count-badge {

      background: rgba(0,212,255,0.08);

      color: #00D4FF;

    }
    .station-count-badge .dot {

    }
    @keyframes liveDotPulse {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }

    }
    
    /* ================================
       播放器增强样式 - P0 Core
       ================================ */
    #player-bar { 
      display: flex; 
      flex-direction: row;
      align-items: center;
      gap: 14px;
      padding: 8px 18px; 
      background: rgba(5,8,16,0.98); 
      backdrop-filter: blur(16px) saturate(1.2); 
      border: 1px solid rgba(255,255,255,0.04); 
      border-radius: 14px; 
      z-index: 1000;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.03);
      margin: 0 10px;
    }
    #player-bar.playing {
      box-shadow: 0 -4px 30px rgba(0,0,0,0.4), 0 0 40px rgba(0,212,255,0.06), 0 0 80px rgba(0,212,255,0.03), inset 0 1px 0 rgba(0,212,255,0.05);
      border-color: rgba(0,212,255,0.1);
    }
    
    .player-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    
    .now-playing { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      flex: 1;
      min-width: 0;
    }
    
    .now-playing-cover { 
      width: 40px; 
      height: 40px; 
      border-radius: 10px; 
      background: linear-gradient(135deg, #00D4FF, #7B68EE); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 18px; 
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,212,255,0.2);
      transition: all 0.3s;
      overflow: hidden;
      cursor: pointer;
    }
    .now-playing-cover:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 24px rgba(0,212,255,0.35);
    }
    
    .now-playing-cover img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      object-fit: contain;
      background: transparent !important;
    }
    
    .now-playing-cover.playing {
      animation: coverGlow 3s ease-in-out infinite;
    }
    @keyframes coverGlow {
      0%, 100% { box-shadow: 0 4px 16px rgba(0,212,255,0.25); }
      50% { box-shadow: 0 4px 24px rgba(0,212,255,0.45), 0 0 20px rgba(0,212,255,0.1); }
    }
    
    .now-playing-cover.loading {
      animation: none;
    }
    
    
    .now-playing-info { 
      flex: 1; 
      min-width: 0; 
    }
    
    .now-playing-name { 
      font-size: 13.5px; 
      font-weight: 600; 
      color: rgba(255,255,255,0.88); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .now-playing-name .meta-inline {
      font-size: 10.5px;

      color: rgba(255,255,255,0.3);
    }
    
    .now-playing-meta { display: none; }
    
    .now-playing-meta .separator {
      color: rgba(255,255,255,0.15);
    }

      display: inline-flex;
      align-items: center;
      gap: 4px;

      color: #00D4FF;
    }
    
    .station-status.error {
      background: rgba(255,77,109,0.1);
      color: #ff4d6d;
    }
    
    .station-status.buffering {

      color: #ffc107;
    }
    
    /* progress bar removed */
    /* 波形可视化增强 */
    .waveform-visualizer { 
      flex: 1; 
      height: 34px; 
      display: flex; 
      align-items: center; 
      justify-content: stretch;
      gap: 2px; 
      background: rgba(255,255,255,0.03); 
      border-radius: 8px; 
      padding: 4px 6px; 
      max-width: 400px;
      min-width: 120px;
    }
    
    .wave-bar { 
      flex: 1;
      min-height: 3px;
      border-radius: 2px; 
      transition: height 0.06s ease-out;
      transform-origin: center;
    }
    /* waveform unified cyan gradient */
    .wave-bar { background: linear-gradient(to top, rgba(0,212,255,0.3), rgba(0,212,255,0.9)); }
    .wave-bar:nth-child(-n+8) { background: linear-gradient(to top, rgba(0,212,255,0.4), rgba(0,180,255,0.95)); }
    .wave-bar:nth-child(n+9):nth-child(-n+16) { background: linear-gradient(to top, rgba(0,200,255,0.35), rgba(100,180,255,0.85)); }
    .wave-bar:nth-child(n+17):nth-child(-n+24) { background: linear-gradient(to top, rgba(60,140,255,0.3), rgba(123,104,238,0.8)); }
    .wave-bar:nth-child(n+25) { background: linear-gradient(to top, rgba(123,104,238,0.25), rgba(123,104,238,0.7)); }

    .play-controls { 
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }
    
    .control-btn { 
      width: 32px; 
      height: 32px; 
      border-radius: 8px; 
      border: none; 
      background: rgba(255,255,255,0.05); 
      color: #E0E6ED;

    }
    .control-btn:active { transform: scale(0.92); transition: transform 0.1s; }

    }
    
    .volume-btn {

      height: 28px;
      border-radius: 7px;

// 收藏与历史功能
// ================================
function addToHistory(station) {
  if (!station) return;
  const entry = { stationuuid: station.stationuuid, name: station.name, country: station.country, countrycode: station.countrycode, language: station.language, bitrate: station.bitrate, tags: station.tags, url_resolved: station.url_resolved, geo_lat: station.geo_lat, geo_long: station.geo_long, favicon: station.favicon, homepage: station.homepage, url: station.url, codec: station.codec, votes: station.votes, clickcount: station.clickcount, time: Date.now() };
  STATE.history = STATE.history.filter(h => h.stationuuid !== station.stationuuid);
  STATE.history.unshift(entry);
  if (STATE.history.length > 50) STATE.history = STATE.history.slice(0, 50);
  localStorage.setItem('gr_history', JSON.stringify(STATE.history));
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('hist-list');
  if (!list) return;
  if (!STATE.history.length) {
    list.innerHTML = '<div style="font-size:12px;color:#8A99AB;padding:12px;text-align:center">暂无播放历史</div>';
    return;
  }
  list.innerHTML = STATE.history.map(h => {
    const timeStr = new Date(h.time).toLocaleString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const safeUuid = escapeHtml(h.stationuuid);
    const safeName = escapeHtml(h.name||'未知');
    return `<div class="station-item" data-uuid="${safeUuid}" onclick="selectStation(STATE.stations.find(s=>s.stationuuid==='${safeUuid}')||JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(h))}')))">
      <div class="icon">${getCountryEmoji(h.countrycode)}</div>
      <div class="info"><div class="name">${safeName}</div><div class="meta">${timeStr}</div></div>
    </div>`;
  }).join('');
}

function clearHistory() {
  STATE.history = [];
  localStorage.removeItem('gr_history');
  renderHistory();
  showToast('🗑️ 历史已清空');
}

function toggleFavorite(station) {
  if (!station) station = STATE.currentStation;
  if (!station) { showToast('请先选择电台'); return; }
  const idx = STATE.favorites.findIndex(f => f.stationuuid === station.stationuuid);
  if (idx >= 0) {
    STATE.favorites.splice(idx, 1);
    showToast('💔 已取消收藏');
  } else {
    STATE.favorites.push({...station});
    showToast('❤️ 已收藏');
  }
  localStorage.setItem('gr_favorites', JSON.stringify(STATE.favorites));
  renderFavorites();
  updateFavBtn();
}

function renderFavorites() {
  const list = document.getElementById('fav-list');
  if (!list) return;
  if (!STATE.favorites.length) {
    list.innerHTML = '<div style="font-size:12px;color:#8A99AB;padding:12px;text-align:center">暂无收藏，播放时点击 ❤️ 收藏</div>';
    return;
  }
  list.innerHTML = STATE.favorites.map(f => {
    const safeUuid = escapeHtml(f.stationuuid);
    const safeName = escapeHtml(f.name||'未知');
    const safeCountry = escapeHtml(f.country||'');
    const safeLang = escapeHtml(f.language||'');
    return `<div class="station-item" data-uuid="${safeUuid}" onclick="selectStation(STATE.stations.find(s=>s.stationuuid==='${safeUuid}')||JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(f))}')))">
      <div class="icon">${getCountryEmoji(f.countrycode)}</div>
      <div class="info"><div class="name">${safeName}</div><div class="meta">${safeCountry} · ${safeLang}</div></div>
      <button onclick="event.stopPropagation();toggleFavorite(STATE.favorites.find(x=>x.stationuuid==='${safeUuid}'))" style="background:none;border:none;color:#ff4d6d;cursor:pointer;font-size:14px;padding:4px;">❤️</button>
    </div>`;
  }).join('');
}

function updateFavBtn() {
  const btn = document.getElementById('btn-fav');
  if (!btn || !STATE.currentStation) return;
  const isFav = STATE.favorites.some(f => f.stationuuid === STATE.currentStation.stationuuid);
  btn.textContent = isFav ? '❤️' : '🤍';
  btn.title = isFav ? '取消收藏' : '添加收藏';
}

// 从电台列表红心按钮切换收藏
function toggleFavFromList(uuid, btnEl) {
  const station = STATE.stations.find(s => s.stationuuid === uuid)
    || STATE.favorites.find(f => f.stationuuid === uuid);
  if (!station) return;
  const idx = STATE.favorites.findIndex(f => f.stationuuid === uuid);
  if (idx >= 0) {
    STATE.favorites.splice(idx, 1);
    if (btnEl) { btnEl.classList.remove('faved'); btnEl.innerHTML = '♡'; btnEl.title = '收藏'; }
    showToast('💔 已取消收藏');
  } else {
    STATE.favorites.push({...station});
    if (btnEl) { btnEl.classList.add('faved'); btnEl.innerHTML = '❤'; btnEl.title = '取消收藏'; }
    showToast('❤️ 已收藏');
  }
  localStorage.setItem('gr_favorites', JSON.stringify(STATE.favorites));
  renderFavorites();
  updateFavBtn();
}

// 获取可用的Radio Browser服务器 (支持多服务器轮询)
const RADIO_SERVERS = [
  'https://de1.api.radio-browser.info',
  'https://de2.api.radio-browser.info',
  'https://fi1.api.radio-browser.info'
];
let _serverIdx = 0;
async function getRadioBrowserServer() {
  // 尝试找到可用的服务器
  for (let i = 0; i < RADIO_SERVERS.length; i++) {
    const idx = (_serverIdx + i) % RADIO_SERVERS.length;
    try {
      const resp = await fetch(RADIO_SERVERS[idx] + '/json/stats', { signal: AbortSignal.timeout(3000) });
      if (resp.ok) {
        _serverIdx = idx;
        return RADIO_SERVERS[idx];
      }
    } catch(e) { /* try next */ }
  }
  return RADIO_SERVERS[0]; // fallback
}

      'JP','KR','IN','TH','VN','ID','MY','PH','SG','TW','HK','PK','BD','LK','NP','MM','KH','LA','MN',
      // 欧洲
      'GB','DE','FR','IT','ES','NL','SE','NO','DK','FI','AT','CH','PL','RU','UA','BE','PT','GR','CZ','RO','HU','IE','RS','HR','BG','SK','SI','LT','LV','EE',
      // 美洲
      'US','CA','MX','BR','AR','CO','CL','PE','VE','EC','CU','DO','GT','HN','PA','CR','UY','PY','BO',
      // 非洲
      'EG','ZA','NG','KE','GH','TZ','MA','TN','SN','CM','ET','UG','RW','CI','DZ','LY',
      // 大洋洲
      'AU','NZ','FJ','PG'
    ];
    
    // 分批并发获取（每批8个国家，每国最多50个电台）
    const BATCH_SIZE = 8;
    const PER_COUNTRY = 50;
    
    for (let i = 0; i < countryList.length; i += BATCH_SIZE) {
      const batch = countryList.slice(i, i + BATCH_SIZE);
      const results = await Promise.allSettled(
        batch.map(cc => fetchStationsByCountry(server, cc, PER_COUNTRY))
      );
      results.forEach(r => {
        if (r.status === 'fulfilled' && r.value.length > 0) {
          stations = stations.concat(r.value);
        }
      });
      // 更新进度
      const progress = Math.min(100, Math.round((i + BATCH_SIZE) / countryList.length * 100));
      document.getElementById('loading-text').textContent = '加载电台 ' + stations.length + '+ (' + progress + '%)';
    }
    
    // 补充全球热门电台
    try {
      const topStations = await fetchTopStations(server, 100);
      stations = stations.concat(topStations);
    } catch(e) {}
    
    // 去重
    const seenUuids = new Set();
    stations = stations.filter(station => {
      if (seenUuids.has(station.stationuuid)) return false;
      seenUuids.add(station.stationuuid);
      return true;
    });
    
    // 处理电台数据并添加坐标
    stations = stations.map(station => processStationData(station)).filter(s => s !== null);
    
    // 合并中国省市电台（硬编码坐标准确数据）
    // 过滤掉API中坐标准确度不高的中国电台，使用我们的硬编码数据
    stations = stations.filter(s => (s.countrycode || '').toUpperCase() !== 'CN');
    const chineseStations = getChineseStations();
    stations = stations.concat(chineseStations);
    
    STATE.stations = stations;
    STATE.filteredStations = stations;
    
    // 更新UI
    updateStats();
    applyCurrentFilters();
    
    showToast('\u2705 加载了 ' + stations.length + ' 个全球电台');
    console.log('Loaded ' + stations.length + ' stations');
    
  } catch (error) {
    console.error('Failed to load stations:', error);
    showToast('\u26A0\uFE0F API加载失败，使用示例数据');
    loadSampleStations();
  }
}

// 按国家获取电台
async function fetchStationsByCountry(server, countryCode, limit = 20) {
  try {
    const url = `${server}/json/stations/bycountrycodeexact/${countryCode}?limit=${limit}&order=clickcount&reverse=true`;
    const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await response.json();
    return data;
  } catch (error) {
    console.error(`Error fetching stations for ${countryCode}:`, error);
    return [];
  }
}

// 获取热门电台
async function fetchTopStations(server, limit = 100) {
  try {
    const url = `${server}/json/stations/topclick?limit=${limit}`;
    const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
    const data = await response.json();
    return data;
  } catch (error) {
    console.error('Error fetching top stations:', error);
    return [];
  }
}

// 处理电台数据，添加坐标
function processStationData(station) {
  if (!station || !station.url_resolved) return null;
  
  // 获取国家代码
  const countryCode = station.countrycode ? station.countrycode.toUpperCase() : null;
  
  // 获取坐标
  let geo_lat = station.geo_lat;
  let geo_long = station.geo_long;
  
  // 过滤掉坐标为 (0,0) 或无效的电台 — 这些电台没有真实地理位置
  if ((geo_lat === 0 && geo_long === 0) || geo_lat === null || geo_long === null) {
    geo_lat = null;
    geo_long = null;
  }
  
  // 如果API没有提供有效坐标，使用国家默认坐标（小范围偏移避免重叠）
  if ((!geo_lat || !geo_long) && countryCode && STATE.countryCoordinates[countryCode]) {
    const coords = STATE.countryCoordinates[countryCode];
    // 小范围随机偏移（±0.5°≈55km），确保标记在正确区域附近
    geo_lat = coords.lat + (Math.random() - 0.5) * 1;
    geo_long = coords.lon + (Math.random() - 0.5) * 1;
  }
  
  // 如果还是没有坐标，跳过该电台（不再随机分配到大洋中）
  if (!geo_lat || !geo_long) {
    return null;
  }
  
  return {
    stationuuid: station.stationuuid,
    name: station.name || '未知电台',
    url: station.url,
    url_resolved: station.url_resolved,
    homepage: station.homepage,
    favicon: station.favicon,
    tags: station.tags || '',
    country: station.country || '未知',
    countrycode: countryCode,
    language: station.language || '未知',
    codec: station.codec,
    bitrate: station.bitrate,
    votes: station.votes,
    clickcount: station.clickcount,
    geo_lat: geo_lat,
    geo_long: geo_long
  };
}

function updateFilterUI(filterType, activeValue) {
  const containers = {
    'continent': document.querySelectorAll('.filter-chips:nth-of-type(1) .filter-chip'),
    'genre': document.querySelectorAll('.filter-chips:nth-of-type(2) .filter-chip'),

  };
  
  if (containers[filterType]) {

      const chipValue = chip.getAttribute('onclick').match(/'([^']+)'/)[1];
      chip.classList.toggle('active', chipValue === activeValue);
    });
  }
}

function applyCurrentFilters() {
  let filtered = [...STATE.stations];
  
  // 搜索过滤
  if (STATE.filters.search) {
    filtered = filtered.filter(s => 
      s.name?.toLowerCase().includes(STATE.filters.search) ||
      s.language?.toLowerCase().includes(STATE.filters.search) ||
      s.country?.toLowerCase().includes(STATE.filters.search) ||
      s.tags?.toLowerCase().includes(STATE.filters.search)
    );
  }
  
  // 大洲过滤
  if (STATE.filters.continent !== 'all') {
    filtered = filtered.filter(s => {
      if (!s.countrycode) return false;
      const continent = STATE.continentMap[s.countrycode.toUpperCase()];
      return continent === STATE.filters.continent;
    });
  }
  
  // 类型过滤
  if (STATE.filters.genre !== 'all') {
    filtered = filtered.filter(s => 
      s.tags?.toLowerCase().includes(STATE.filters.genre)
    );
  }
  
  // 语言过滤
  if (STATE.filters.language !== 'all') {
    filtered = filtered.filter(s => 
      s.language?.toLowerCase().includes(STATE.filters.language)
    );
  }
  
  STATE.filteredStations = filtered;
  document.getElementById('result-count').textContent = filtered.length;
  renderStationList(filtered);
  updateGlobeMarkers(filtered);
}

// ================================
// 波形可视化增强
// ================================
let waveformAnimationId = null;

function animateWaveform() {
  if (!STATE.isPlaying) return;
  
  const bars = document.querySelectorAll('.wave-bar');
  const barCount = bars.length;
  const maxH = 32;
  // Each bar has a persistent "energy" value for smooth animation
  if (!window._waveEnergy) {
    window._waveEnergy = new Float32Array(barCount);
    for (let i = 0; i < barCount; i++) window._waveEnergy[i] = 0.2;
  }
  
  function update() {
    if (!STATE.isPlaying) {
      stopWaveformAnimation();
      return;
    }
    
    const time = Date.now() / 1000;
    
    bars.forEach((bar, i) => {
      const norm = i / barCount;
      // Bass frequencies (left bars) are stronger
      const bassWeight = Math.max(0, 1 - norm * 1.5);
      // Mid frequencies (center bars)
      const midWeight = 1 - Math.abs(norm - 0.4) * 2;
      // High frequencies (right bars) are lighter
      const highWeight = Math.max(0, norm - 0.5) * 0.6;
      
      // Multiple sine waves at different frequencies simulate music
      const wave1 = Math.sin(time * 3.5 + i * 0.4) * 0.5 + 0.5;
      const wave2 = Math.sin(time * 7.2 + i * 0.7) * 0.3 + 0.3;
      const wave3 = Math.sin(time * 1.8 + i * 0.2) * 0.4 + 0.4;
      const beat = Math.pow(Math.sin(time * 2.2) * 0.5 + 0.5, 3); // beat pulse
      
      const raw = (wave1 * bassWeight + wave2 * midWeight + wave3 * highWeight + beat * bassWeight * 0.5) / 1.5;
      const noise = Math.random() * 0.15;
      const target = Math.max(0.08, Math.min(1, raw + noise));
      
      // Smooth energy transition
      window._waveEnergy[i] += (target - window._waveEnergy[i]) * 0.35;
      const h = Math.max(3, window._waveEnergy[i] * maxH);
      bar.style.height = h + 'px';
    });
    
    waveformAnimationId = requestAnimationFrame(update);
  }
  
  update();
}

function stopWaveformAnimation() {
  if (waveformAnimationId) {
    cancelAnimationFrame(waveformAnimationId);
    waveformAnimationId = null;
  }
  window._waveEnergy = null;
  const bars = document.querySelectorAll('.wave-bar');
  bars.forEach(bar => { bar.style.height = '3px'; });
}

  info.bass = Math.max(-10, Math.min(10, info.bass + delta));

}

function adjustTreble(delta) {
  const info = EQ_PRESETS[currentEQ] || EQ_PRESETS.off;
  info.treble = Math.max(-10, Math.min(10, info.treble + delta));
  showToast('🎛️ 高音: ' + (info.treble > 0 ? '+' : '') + info.treble);
}

// ================================
// 倒计时停播
// ================================
let timerInterval = null;
let timerRemaining = 0;

function setTimer(minutes) {
  // 关闭已有计时
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; timerRemaining = 0; }
  // 关闭下拉
  const dd = document.getElementById('timer-dropdown');
  if (dd) dd.classList.remove('open');

  if (minutes <= 0) {
    showToast('⏱️ 倒计时已取消');
    updateTimerDisplay('');
    return;
  }
  timerRemaining = minutes * 60;
  showToast('⏱️ ' + minutes + ' 分钟后自动停播');
  updateTimerDisplay(formatTimer(timerRemaining));

  timerInterval = setInterval(function() {
    timerRemaining--;
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      // 停止播放
      if (STATE.audio && STATE.isPlaying) {
        STATE.audio.pause();
        showToast('⏱️ 倒计时结束，已停止播放');
      }
      updateTimerDisplay('');
      return;
    }
    // 最后60秒提示
    if (timerRemaining === 60) showToast('⏱️ 还剩 1 分钟');
    if (timerRemaining <= 10) showToast('⏱️ ' + timerRemaining + '秒');
    updateTimerDisplay(formatTimer(timerRemaining));
  }, 1000);
}

function formatTimer(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function updateTimerDisplay(text) {
  // 在倒计时按钮上显示剩余时间
  const btn = document.querySelector('#timer-dropdown > button');
  if (!btn) return;
  if (text) {
    btn.title = '倒计时 ' + text;
    btn.style.position = 'relative';
    let badge = btn.querySelector('.timer-badge');
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'timer-badge';
      badge.style.cssText = 'position:absolute;top:-4px;right:-8px;font-size:8px;background:#00D4FF;color:#0a0f1c;padding:1px 4px;font-weight:700;';
      btn.appendChild(badge);
    }
    badge.textContent = text;
  } else {
    btn.title = '倒计时';
    const badge = btn.querySelector('.timer-badge');
    if (badge) badge.remove();
  }
}

function prevStation() {
  if (!STATE.filteredStations.length) return;
  
  const idx = STATE.filteredStations.findIndex(s => s.stationuuid === STATE.currentStation?.stationuuid);
  const prevIdx = idx > 0 ? idx - 1 : STATE.filteredStations.length - 1;
  selectStation(STATE.filteredStations[prevIdx]);
}

function nextStation() {
  if (!STATE.filteredStations.length) return;
  
  let nextIdx;
  if (STATE.shuffle) {
    // 随机播放
    const idx = STATE.filteredStations.findIndex(s => s.stationuuid === STATE.currentStation?.stationuuid);
    nextIdx = Math.floor(Math.random() * STATE.filteredStations.length);
    if (nextIdx === idx && STATE.filteredStations.length > 1) {
      nextIdx = (nextIdx + 1) % STATE.filteredStations.length;
    }
  } else {
    // 顺序播放
    const idx = STATE.filteredStations.findIndex(s => s.stationuuid === STATE.currentStation?.stationuuid);
    nextIdx = idx < STATE.filteredStations.length - 1 ? idx + 1 : 0;
  }
  
  selectStation(STATE.filteredStations[nextIdx]);
}

function selectStation(station) {
  STATE.currentStation = station;
  updatePlayer();
  
  // 停止当前播放
  if (STATE.audio) {
    STATE.audio.pause();
    STATE.audio.src = '';
  }
  
  // 播放新电台
  if (station && station.url_resolved) {
    updatePlayerStatus('连接中...', 'buffering');
    document.getElementById('player-cover').classList.add('loading');
    
    const streamUrl = station.url_resolved;
    // 检测是否为 HLS (.m3u8) 流
    if (streamUrl.includes('.m3u8') && typeof Hls !== 'undefined' && Hls.isSupported()) {
      // 使用 hls.js 接管播放
      if (STATE.hls) { STATE.hls.destroy(); }
      const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
      STATE.hls = hls;
      hls.loadSource(streamUrl);
      hls.attachMedia(STATE.audio);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        STATE.audio.play().catch(e => {
          console.error('HLS播放失败:', e);
          updatePlayerStatus('连接失败', 'error');
          showToast('⚠️ 电台无法播放，请尝试其他电台');
        });
      });
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          console.error('HLS致命错误:', data);
          updatePlayerStatus('连接失败', 'error');
          document.getElementById('player-cover').classList.remove('loading');
          showToast('⚠️ 电台流加载失败');
          hls.destroy();
        }
      });
    } else {
      STATE.audio.src = streamUrl;
      STATE.audio.play().catch(e => {
        console.error('播放失败:', e);
        updatePlayerStatus('连接失败', 'error');
        document.getElementById('player-cover').classList.remove('loading');
        document.getElementById('player-cover').classList.remove('playing');
        showToast('⚠️ 电台无法播放，请尝试其他电台');
      });
    }
  }
  
  // 更新UI状态并联动滚动
  document.querySelectorAll('.station-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`[data-uuid="${station.stationuuid}"]`).forEach(el => {
    el.classList.add('active');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  updateFavBtn();
  
  // 飞到电台位置
  if (STATE.viewer && station.geo_lat && station.geo_long) {
    STATE.viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(station.geo_long, station.geo_lat, 5000000),
      duration: 2
    });
    
    highlightStation(station);
  }
  
  // 记录播放历史
  addToHistory(station);
  
  showToast(`🎵 正在播放: ${station.name}`);
}

function updatePlayer() {
  const station = STATE.currentStation;
  const coverEl = document.getElementById('player-cover');
  const nameEl = document.getElementById('player-name');
  const metaInline = document.getElementById('player-meta-inline');
  
  if (station) {
    // Set name text node (first child)
    const nameText = station.name || '未知电台';
    if (nameEl.firstChild && nameEl.firstChild.nodeType === 3) {
      nameEl.firstChild.textContent = nameText + ' ';
    } else {
      nameEl.insertBefore(document.createTextNode(nameText + ' '), metaInline);
    }
    
    const countryCn = getCountryCn(station.country);
    const bitrate = station.bitrate ? station.bitrate + ' kbps' : '--';
    if (metaInline) metaInline.textContent = '\uD83C\uDF0D ' + countryCn + ' \u00B7 ' + bitrate + ' \u00B7 播放中';
    
    // 封面显示真实LOGO
    const favicon = station.favicon;
    if (favicon && (favicon.startsWith('http://') || favicon.startsWith('https://'))) {
      coverEl.textContent = '';
      const img = document.createElement('img');
      img.src = favicon;
      img.style.cssText = 'width:100%;height:100%;border-radius:10px;object-fit:contain;';
      img.onerror = function() { this.parentElement.textContent = '\uD83D\uDCFB'; };
      coverEl.appendChild(img);
    } else {
      const emoji = getCountryEmoji(station.countrycode);
      coverEl.textContent = emoji || '📻';
    }
    
    if (STATE.isPlaying) {
      coverEl.classList.add('playing');
      coverEl.classList.remove('loading');
    } else {
      coverEl.classList.remove('playing');
    }
  } else {
    if (nameEl.firstChild && nameEl.firstChild.nodeType === 3) {
      nameEl.firstChild.textContent = '点击地球选择电台 ';
    }
    if (metaInline) metaInline.textContent = '\uD83C\uDF0D 全球广播 \u00B7 待机';
    coverEl.innerHTML = '📻';
    coverEl.classList.remove('playing', 'loading');
  }
}

function getCountryEmoji(countryCode) {
  if (!countryCode) return '🌍';
  
  const codeMap = {
    'CN': '🇨🇳', 'US': '🇺🇸', 'JP': '🇯🇵', 'GB': '🇬🇧', 'DE': '🇩🇪',
    'FR': '🇫🇷', 'IT': '🇮🇹', 'ES': '🇪🇸', 'RU': '🇷🇺', 'AU': '🇦🇺',
    'CA': '🇨🇦', 'BR': '🇧🇷', 'IN': '🇮🇳', 'KR': '🇰🇷', 'MX': '🇲🇽',
    'AR': '🇦🇷', 'EG': '🇪🇬', 'ZA': '🇿🇦', 'NG': '🇳🇬', 'PK': '🇵🇰',
    'ID': '🇮🇩', 'VN': '🇻🇳', 'TH': '🇹🇭', 'PH': '🇵🇭', 'MY': '🇲🇾'
  };
  
  return codeMap[countryCode.toUpperCase()] || '🌍';
}

function highlightStation(station) {
  // 移除之前的高亮和脉冲
  STATE.entities.forEach(e => {
    if (e._isHighlight || e._isPulse) STATE.viewer.entities.remove(e);
  });
  STATE.entities = STATE.entities.filter(e => !e._isHighlight && !e._isPulse);
  
  const GREEN = Cesium.Color.fromCssColorString('#39FF14');
  
  // 高亮圆点 — 大号亮绿色点
  const dot = STATE.viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(station.geo_long, station.geo_lat, 2000),
    point: {
      pixelSize: 18,
      color: GREEN,
      outlineColor: Cesium.Color.WHITE,
      outlineWidth: 3,
      heightReference: Cesium.HeightReference.NONE,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    },
    label: {
      text: station.name || '',
      font: 'bold 14px "Microsoft YaHei", -apple-system, sans-serif',
      fillColor: GREEN,
      outlineColor: Cesium.Color.BLACK,
      outlineWidth: 3,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE,
      verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
      pixelOffset: new Cesium.Cartesian2(0, -18),
      heightReference: Cesium.HeightReference.NONE,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    },
    _isHighlight: true
  });
  STATE.entities.push(dot);
}

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  
  switch(e.code) {
    case 'Space':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      prevStation();
      break;
    case 'ArrowRight':
      e.preventDefault();
      nextStation();
      break;
    case 'ArrowUp':
      e.preventDefault();
      setVolume(Math.min(100, Math.round(STATE.volume * 100) + 10));
      document.getElementById('volume-slider').value = Math.round(STATE.volume * 100);
      break;
    case 'ArrowDown':
      e.preventDefault();
      setVolume(Math.max(0, Math.round(STATE.volume * 100) - 10));
      document.getElementById('volume-slider').value = Math.round(STATE.volume * 100);
      break;
    case 'KeyM':
      toggleMute();
      break;
    case 'KeyR':
      resetView();
      break;
    case 'Home':
      resetView();
      break;
    case 'KeyB':
      addBookmark();
      break;
    case 'KeyD':
      toggleDayNight();
      break;
  }
});

let _toastEl = null, _toastTimer = null;
function showToast(msg) {
  if (!_toastEl) {
    _toastEl = document.createElement('div');
    _toastEl.className = 'toast';
    document.body.appendChild(_toastEl);
  }
  _toastEl.textContent = msg;
  _toastEl.style.display = 'block';
  _toastEl.style.animation = 'none';
  void _toastEl.offsetWidth; // 强制reflow重启动画
  _toastEl.style.animation = 'fadeInUp 0.3s';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { _toastEl.style.display = 'none'; }, 3000);
}

function switchTab(evt, tab) {
  document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
  if (evt && evt.target) { evt.target.classList.add('active'); evt.target.setAttribute('aria-selected', 'true'); }
  ['filter', 'fav', 'hist'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    if (el) el.style.display = t === tab ? '' : 'none';
  });
}

function flyToCity(cityName, lat, lon) {
  if (!STATE.viewer) return;
  showToast(`🌍 定位到 ${cityName}`);
  
  // 推荐附近电台（飞行完成后触发）
  const recommendNearby = () => {
    const nearby = STATE.stations.filter(s => {
      if (!s.geo_lat || !s.geo_long) return false;
      const dist = Math.sqrt(Math.pow(s.geo_lat - lat, 2) + Math.pow(s.geo_long - lon, 2));
      return dist < 10;
    });
    if (nearby.length > 0) {
      showToast(`📻 ${cityName}附近找到 ${nearby.length} 个电台`);
      renderStationList(nearby);
      document.getElementById('result-count').textContent = nearby.length;
    }
  };
  
  STATE.viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, 5000000),
    orientation: {
      heading: Cesium.Math.toRadians(0),
      pitch: Cesium.Math.toRadians(-90),
      roll: 0
    },
    duration: 1.5,
    complete: recommendNearby
  });
}

function flyToContinent(continent, btnEl) {
  if (!STATE.viewer) return;
  
  // 切换导航高亮
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  
  const viewpoints = {
    global: { lon: 0, lat: 20, height: 22000000 },
    asia: { lon: 100, lat: 30, height: 12000000 },
    europe: { lon: 15, lat: 50, height: 8000000 },
    america: { lon: -90, lat: 20, height: 12000000 },
    africa: { lon: 20, lat: 10, height: 10000000 },
    oceania: { lon: 135, lat: -25, height: 10000000 }
  };
  const names = { global: '全球', asia: '亚洲', europe: '欧洲', america: '美洲', africa: '非洲', oceania: '大洋洲' };
  
  const view = viewpoints[continent];
  if (view) {
    STATE.viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(view.lon, view.lat, view.height),
      orientation: {
        heading: 0,
        pitch: -Cesium.Math.PI_OVER_TWO,
        roll: 0
      },
      duration: 2.5
    });
    showToast('\uD83C\uDF0D 飞往 ' + (names[continent] || continent));
  }
  
  // Also filter stations by continent
  if (continent === 'global') {
    STATE.filters.continent = 'all';
  } else {
    STATE.filters.continent = continent;
  }
  applyCurrentFilters();
}

  if (!STATE.viewer) return;

      pitch: -Cesium.Math.PI_OVER_TWO,
      roll: 0
    },
    duration: 2
  });

function renderStationList(stations) {
  const list = document.getElementById('station-list');
  if (!stations.length) {
    list.innerHTML = '<div style="font-size:12px;color:#6B7A8C;padding:12px;text-align:center">暂无电台</div>';
    return;
  }
  list.innerHTML = stations.map(s => {
    const countryCn = escapeHtml(getCountryCn(s.country));
    const langCn = escapeHtml(LANG_MAP[(s.language||'').toLowerCase()] || s.language || '多语言');
    const bitrateStr = s.bitrate ? s.bitrate + ' kbps' : '';
    const isFav = STATE.favorites.some(f => f.stationuuid === s.stationuuid);
    const safeName = escapeHtml(s.name || '未命名');
    const safeUuid = escapeHtml(s.stationuuid);
    return `
      <div class="station-item" data-uuid="${safeUuid}" onclick="selectStation(STATE.stations.find(x=>x.stationuuid==='${safeUuid}'))">
        <div class="icon">${getCountryEmoji(s.countrycode)}</div>
        <div class="info">
          <div class="name">${safeName}</div>
          <div class="meta">${countryCn} · ${langCn}${bitrateStr ? ' · ' + bitrateStr : ''}</div>
        </div>
        <button class="station-heart${isFav ? ' faved' : ''}" onclick="event.stopPropagation();toggleFavFromList('${safeUuid}',this)" title="${isFav ? '取消收藏' : '收藏'}">
          ${isFav ? '❤' : '♡'}
        </button>
      </div>
    `;
  }).join('');
}

  const dnDay = document.getElementById('dn-day');

function addBookmark() {
  if (!STATE.viewer) return;
  
  const camera = STATE.viewer.camera;
  const cartographic = Cesium.Cartographic.fromCartesian(camera.position);
  const lon = Cesium.Math.toDegrees(cartographic.longitude);
  const lat = Cesium.Math.toDegrees(cartographic.latitude);
  const height = cartographic.height;
  
  const bookmark = {
    id: Date.now(),
    name: `位置 ${STATE.bookmarks.length + 1}`,
    lon: lon,
    lat: lat,
    height: height,
    heading: camera.heading,
    pitch: camera.pitch,
    roll: camera.roll
  };
  
  STATE.bookmarks.push(bookmark);
  renderBookmarks();
  showToast('⭐ 书签已添加');
}

function renderBookmarks() {
  const list = document.getElementById('bookmark-list');
  if (!list) return; // 如果元素不存在则返回
  
  if (!STATE.bookmarks.length) {
    list.innerHTML = '<div style="font-size:11px;color:#6B7A8C;text-align:center;padding:10px">暂无数签</div>';
    return;
  }
  
  list.innerHTML = STATE.bookmarks.map(b => `
    <div class="bookmark-item" onclick="flyToBookmark(${b.id})">
      <span>📍</span>
      <span>${b.name}</span>
      <span class="delete" onclick="event.stopPropagation();deleteBookmark(${b.id})">×</span>
    </div>
  `).join('');
}

function flyToBookmark(id) {
  const bookmark = STATE.bookmarks.find(b => b.id === id);
  if (!bookmark || !STATE.viewer) return;
  
  STATE.viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(bookmark.lon, bookmark.lat, bookmark.height),
    orientation: {
      heading: bookmark.heading,
      pitch: bookmark.pitch,
      roll: bookmark.roll
    },
    duration: 1.5
  });
  showToast('📍 飞到书签位置');
}

function deleteBookmark(id) {
  STATE.bookmarks = STATE.bookmarks.filter(b => b.id !== id);
  renderBookmarks();
  showToast('❌ 书签已删除');
}

function addLocationLabels() {
  if (!STATE.viewer) return;
  
  // 移除旧的位置标签
  STATE.labelEntities.forEach(e => {
    STATE.viewer.entities.remove(e);
  });
  STATE.labelEntities = [];
  
  const allLabels = [
    ...STATE.locationLabels.countries,
    ...STATE.locationLabels.cities,
    ...STATE.locationLabels.states
  ];
  
  allLabels.forEach(location => {
    let labelFont, labelColor, labelSize;
    
    // 根据类型设置不同的样式
    switch(location.type) {
      case 'country':
        labelFont = 'bold 18px "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif';
        labelColor = Cesium.Color.fromCssColorString('#FFD700');
        labelSize = 18;
        break;
      case 'state':
        labelFont = 'bold 14px "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif';
        labelColor = Cesium.Color.fromCssColorString('#98FB98');
        labelSize = 14;
        break;
      case 'city':
        labelFont = '13px "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif';
        labelColor = Cesium.Color.fromCssColorString('#F0F8FF');
        labelSize = 13;
        break;
      default:
        labelFont = '13px "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif';
        labelColor = Cesium.Color.fromCssColorString('#F0F8FF');
        labelSize = 13;
    }
    
    const entity = STATE.viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(location.lon, location.lat, 100),
      allowPicking: false,  // 标签不可拾取，避免拦截电台圆点点击
      label: {
        text: location.name,
        font: labelFont,
        fillColor: labelColor,
        outlineColor: Cesium.Color.fromCssColorString('rgba(0, 0, 0, 0.8)'),
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        verticalOrigin: Cesium.VerticalOrigin.CENTER,
        horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
        pixelOffset: new Cesium.Cartesian2(0, 0),
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
        show: STATE.showLocationLabels && STATE.labelVisibility[location.type],
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
        // 根据类型设置不同的显示距离
        distanceDisplayCondition: location.type === 'country' 
          ? new Cesium.DistanceDisplayCondition(0, 30000000)
          : location.type === 'state'
            ? new Cesium.DistanceDisplayCondition(0, 18000000)
            : new Cesium.DistanceDisplayCondition(0, 10000000)
      },
      locationType: location.type,
      _isLocationLabel: true
    });
    
    STATE.labelEntities.push(entity);
  });
  
  console.log('🏷 位置标签加载完成');
}

function toggleLocationLabels() {
  STATE.showLocationLabels = !STATE.showLocationLabels;
  
  // 更新所有标签的显示状态

// 切换底图功能
function changeBaseMap(mapType) {
  if (!STATE.viewer) return;
  
  STATE.currentBaseMap = mapType;
  
  // 移除所有现有图层
  const layers = STATE.viewer.imageryLayers;
  while (layers.length > 0) {
    layers.remove(layers.get(0));
  }
  
  let newLayer = null;
  let newLabelLayer = null;
  
  try {
    switch (mapType) {
      case 'osm':
        // OpenStreetMap - 高清街道地图（自带详细地名标签）
        newLayer = layers.addImageryProvider(
          new Cesium.OpenStreetMapImageryProvider({
            url: 'https://tile.openstreetmap.org/',
            maximumLevel: 19
          })
        );
        showToast('🗺️ 已切换到 OpenStreetMap（带详细城市名）');
        break;
        
      case 'osm-humanitarian':
        // OpenStreetMap Humanitarian - 更清晰的地名显示
        newLayer = layers.addImageryProvider(
          new Cesium.OpenStreetMapImageryProvider({
            url: 'https://a.tile.openstreetmap.fr/hot/',
            maximumLevel: 19
          })
        );
        showToast('🗺️ 已切换到 OpenStreetMap Humanitarian（高清地名）');
        break;
        
      case 'ion-aerial':
        // 使用天地图卫星影像（支持中文地名）— 如果天地图不可用则回退到 Cesium Ion
        try {
          newLayer = layers.addImageryProvider(
            new Cesium.WebMapTileServiceImageryProvider({
              url: 'https://t0.tianditu.gov.cn/img_w/wmts?service=WMTS&request=GetTile&version=1.0.0&LAYER=img&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default&format=tiles&tk=fe49f08ef6f3e9dcb98794dbab4d586c',
              layer: 'img',
              style: 'default',
              format: 'image/jpeg',
              tileMatrixSetID: 'GoogleMapsCompatible',
              maximumLevel: 20,
              minimumLevel: 0,
              tilingScheme: new Cesium.WebMercatorTilingScheme()
            })
          );
          // 添加天地图中文注记层
          newLabelLayer = layers.addImageryProvider(
            new Cesium.WebMapTileServiceImageryProvider({
              url: 'https://t0.tianditu.gov.cn/cia_w/wmts?service=WMTS&request=GetTile&version=1.0.0&LAYER=cia&tileMatrixSet=w&TileMatrix={TileMatrix}&TileRow={TileRow}&TileCol={TileCol}&style=default&format=tiles&tk=fe49f08ef6f3e9dcb98794dbab4d586c',
              layer: 'cia',
              style: 'default',
              format: 'image/png',
              tileMatrixSetID: 'GoogleMapsCompatible',
              maximumLevel: 20,
              minimumLevel: 0,
              translucent: true,
              tilingScheme: new Cesium.WebMercatorTilingScheme()
            })
          );
          showToast('🛰️ 已切换到天地图卫星影像（中文地名）');
        } catch(e) {
          console.warn('天地图加载失败，回退到 Cesium Ion 卫星图');
          newLayer = layers.addImageryProvider(
            new Cesium.IonImageryProvider({ assetId: 3, maximumLevel: 20 })
          );
          showToast('🛰️ 天地图不可用，已切换到 Cesium 卫星图');
        }
        break;
        
      case 'ion-street':
        // Cesium Ion 街道地图（带标签）
        newLayer = layers.addImageryProvider(
          new Cesium.IonImageryProvider({ 
            assetId: 4, 
            maximumLevel: 20 
          })
        );
        showToast('🏘️ 已切换到 Cesium 街道地图（带地名）');
        break;
        
      case 'satellite':
        // 卫星地图（无标签）
        newLayer = layers.addImageryProvider(
          new Cesium.IonImageryProvider({ 
            assetId: 3, 
            maximumLevel: 20 
          })
        );
        showToast('🛰️ 已切换到高清卫星地图');
        break;
        
      default:
        // 默认使用Cesium Ion官方卫星影像（与官网一致）
        newLayer = layers.addImageryProvider(
          new Cesium.IonImageryProvider({ 
            assetId: 3, 
            maximumLevel: 20 
          })
        );
        // 不添加底图标签层，使用自定义中文标签
        if (newLabelLayer) {
          layers.remove(newLabelLayer);
          newLabelLayer = null;
        }
        showToast('🛰️ 已切换到 Cesium Ion 卫星地图');
    }
  } catch (error) {
    console.error('底图加载失败:', error);
    showToast('⚠️ 底图加载失败，使用默认地图');
    // 出错时使用OpenStreetMap
    newLayer = layers.addImageryProvider(
      new Cesium.OpenStreetMapImageryProvider({
        url: 'https://tile.openstreetmap.org/',
        maximumLevel: 19
      })
    );
  }
  
  if (newLayer) {
    STATE.imageryLayer = newLayer;
    newLayer.alpha = 1.0;
  }
  if (newLabelLayer) {
    STATE.labelLayer = newLabelLayer;
    newLabelLayer.alpha = 1.0;
  }
}

function updateGlobeMarkers(stations) {
  if (!STATE.viewer) return;
  
  // 按热度排序（clickcount + bitrate 加权）
  stations.sort((a, b) => {
    const scoreA = (a.clickcount || 0) + (a.bitrate || 0) + (a.votes || 0) * 10;
    const scoreB = (b.clickcount || 0) + (b.bitrate || 0) + (b.votes || 0) * 10;
    return scoreB - scoreA;
  });
  STATE.sortedStations = stations;
  
  // 渲染全部电台标记（仅首次创建，不随相机变化重建）
  refreshVisibleMarkers();
}

function refreshVisibleMarkers() {
  if (!STATE.viewer || !STATE.sortedStations) return;
  
  // 移除旧的 Primitive Collection
  if (STATE.markerPrimitives) {
    STATE.viewer.scene.primitives.remove(STATE.markerPrimitives);
  }
  
  // 保留高亮实体（Entity方式），标记改用Primitive
  STATE.entities.forEach(e => {
    if (!e._isHighlight) STATE.viewer.entities.remove(e);
  });
  STATE.entities = STATE.entities.filter(e => e._isHighlight);
  
  // 使用 PointPrimitiveCollection 批量渲染，性能远优于逐个 Entity
  const GREEN = Cesium.Color.fromCssColorString('#39FF14');
  const WHITE_A = Cesium.Color.fromCssColorString('rgba(255,255,255,0.4)');
  
  const pointPrimitives = new Cesium.PointPrimitiveCollection();
  // 确保该集合可被拾取
  pointPrimitives.show = true;
  
  STATE.sortedStations.forEach(station => {
    if (!station.geo_lat || !station.geo_long) return;
    
    pointPrimitives.add({
      position: Cesium.Cartesian3.fromDegrees(station.geo_long, station.geo_lat, 2000),
      pixelSize: 6,
      color: GREEN.withAlpha(0.9),
      outlineColor: WHITE_A,
      outlineWidth: 1,
      heightReference: Cesium.HeightReference.NONE,
      id: station  // 官方 id 属性，scene.pick/drillPick 可直接返回 station 对象
    });
  });
  
  STATE.markerPrimitives = STATE.viewer.scene.primitives.add(pointPrimitives);
}

function addCountryBoundaries() {
  if (!STATE.viewer) return;
  
  // 使用 Cesium Ion 提供的国家边界数据
  const promise = Cesium.GeoJsonDataSource.load(
    'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json'
  );
  
  promise.then(dataSource => {
    STATE.boundaryDataSource = dataSource;
    STATE.viewer.dataSources.add(dataSource);
    
    // 设置边界样式
    const entities = dataSource.entities.values;
    for (let i = 0; i < entities.length; i++) {
      const entity = entities[i];
      entity.polygon = {
        material: Cesium.Color.TRANSPARENT,
        outline: true,
        outlineColor: Cesium.Color.CYAN.withAlpha(0.6),
        outlineWidth: 2
      };
    }
    
    // 默认显示边界线
    dataSource.show = true;
    
    console.log('🗺 国家边界加载完成');
  }).catch(error => {
    console.error('加载边界失败:', error);
  });
}

function updateInfoIndicators() {
  if (!STATE.viewer) return;
  
  try {
    const camera = STATE.viewer.camera;
    const position = camera.position;
    const cartographic = Cesium.Cartographic.fromCartesian(position);
    
    const height = Math.max(1, Math.round(cartographic.height / 1000));
    document.getElementById('view-height').textContent = height;
    
    // 估算缩放级别 - 简化计算避免错误
    const zoomLevel = Math.max(1, Math.min(20, Math.round(10 + Math.log(20000000 / cartographic.height) / Math.LN2)));
    document.getElementById('zoom-level').textContent = zoomLevel;
    
    // 比例尺 - 简化显示
    document.getElementById('scale-label').textContent = height > 1000 ? '5000' : '100';
    

  } catch (e) {
    // 忽略错误，不影响功能
  }
}


// 统一拾取辅助函数 - 使用 drillPick 穿透获取标记，兼容 Entity 和 PointPrimitive
function getPickedStation(position) {
  if (!STATE.viewer) return null;
  
  // 优先使用 drillPick 穿透拾取，获取位置下的所有对象
  const drillResults = STATE.viewer.scene.drillPick(position, 15);
  if (drillResults && drillResults.length > 0) {
    for (let i = 0; i < drillResults.length; i++) {
      const obj = drillResults[i].id;
      if (!obj) continue;
      // Entity 方式: station 挂载在 entity.station
      if (obj.station && obj.station.name) return obj.station;
      // PointPrimitive id 属性: 直接返回 station 对象
      if (obj.name && obj.url_resolved) return obj;
      // PointPrimitive _station 属性（兼容旧方式）
      if (obj._station && obj._station.name) return obj._station;
    }
  }
  
  // 回退到 scene.pick
  const picked = STATE.viewer.scene.pick(position);
  if (!Cesium.defined(picked)) return null;
  if (picked.id && picked.id.station && picked.id.station.name) return picked.id.station;
  if (picked.id && picked.id.name && picked.id.url_resolved) return picked.id;
  if (picked.id && picked.id._station && picked.id._station.name) return picked.id._station;
  
  return null;
}

function showStationTooltip(position) {
  if (!STATE.viewer) return;
  
  const station = getPickedStation(position);
  if (station) {
    const tooltip = document.getElementById('station-tooltip');
    
    // 设置电台信息
    document.getElementById('tooltip-name').textContent = station.name || '未知电台';
    document.getElementById('tooltip-country').textContent = getCountryCn(station.country);
    document.getElementById('tooltip-lang').textContent = getLangCn(station.language);
    
    const tags = station.tags || '';
    const tagList = tags.split(',').slice(0, 3);
    const tagCn = tagList.map(t => getGenreCn(t)).join(' · ');
    document.getElementById('tooltip-type').textContent = tagCn || '未知';
    
    document.getElementById('tooltip-bitrate').textContent = station.bitrate ? station.bitrate + ' kbps' : '未知';
    
    // 设置提示框位置（含边界检测）
    let tx = position.x + 15;
    let ty = position.y - 10;
    const tw = 280, th = 180; // tooltip 估算尺寸
    if (tx + tw > window.innerWidth) tx = position.x - tw - 15;
    if (ty + th > window.innerHeight) ty = window.innerHeight - th - 10;
    if (ty < 10) ty = 10;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
    tooltip.classList.add('show');
  } else {
    hideStationTooltip();
  }
}

function hideStationTooltip() {
  const tooltip = document.getElementById('station-tooltip');
  tooltip.classList.remove('show');
}

function initCesium() {
  try {
    document.getElementById('loading-text').textContent = '初始化 3D 地球...';
    
    // 添加加载超时处理
    let loadTimeout = setTimeout(() => {
      if (STATE.isLoading) {
        document.getElementById('loading-text').textContent = '加载较慢，请稍后...';
      }
    }, 5000);
    
    STATE.viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      baseLayerPicker: false,
      fullscreenButton: false,
      vrButton: false,
      geocoder: false,
      homeButton: false,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      navigationHelpButton: false,
      navigationInstructionsInitiallyVisible: false,
      scene3DOnly: true,
      // 暂时不使用复杂地形，加快加载
      // terrainProvider: Cesium.createWorldTerrain({
      //   requestWaterMask: true,
      //   requestVertexNormals: true
      // }),
      // 优化渲染质量，同时保证加载速度
      sceneMode: Cesium.SceneMode.SCENE3D,
      mapProjection: new Cesium.WebMercatorProjection(),
      targetFrameRate: 60,
      useDefaultRenderLoop: true
    });
    
    // 使用统一的底图加载函数
    changeBaseMap(STATE.currentBaseMap);
    
    // 隐藏默认 credit
    STATE.viewer.cesiumWidget.creditContainer.style.display = 'none';
    
    // Cesium官网风格设置
    // 启用光照效果，使地球更立体
    STATE.viewer.scene.globe.enableLighting = true;
    
    // 启用动态大气光照，模拟真实光照
    STATE.viewer.scene.globe.dynamicAtmosphereLighting = true;
    STATE.viewer.scene.globe.dynamicAtmosphereLightingFromSun = true;
    
    // 显示大气层光晕效果
    STATE.viewer.scene.globe.showGroundAtmosphere = true;
    
    // 设置深蓝色太空背景（与Cesium官网一致）
    STATE.viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0a1628');
    
    // 调整大气层颜色，使其更接近官网效果
    STATE.viewer.scene.skyAtmosphere.hueShift = -0.08;
    STATE.viewer.scene.skyAtmosphere.saturationShift = 0.1;
    STATE.viewer.scene.skyAtmosphere.brightnessShift = 0.05;
    
    // 优化远距离清晰度
    STATE.viewer.scene.globe.maximumScreenSpaceError = 2; // 更小的值意味着更清晰
    STATE.viewer.scene.globe.tileCacheSize = 1000; // 增大缓存，加快加载
    STATE.viewer.scene.globe.fractionalZoom = true; // 启用分数缩放，平滑过渡
    STATE.viewer.scene.globe.baseColor = Cesium.Color.WHITE; // 设置基础颜色
    
    // 启用深度测试，确保标记固定在地球表面而非飘在空中
    STATE.viewer.scene.globe.depthTestAgainstTerrain = true;
    
    // 缩放级别由底图 provider 的 maximumLevel 控制，不再直接访问内部API
    
    // 监听第一次渲染完成，然后隐藏加载界面
    STATE.viewer.scene.postRender.addEventListener(() => {
      if (STATE.isLoading) {
        clearTimeout(loadTimeout);
        STATE.isLoading = false;
        document.getElementById('loading-overlay').style.display = 'none';
        
        // 继续添加其他功能
        addLocationLabels();
        
        console.log('✅ 初始化完成');
      }
    });
    
    // 设置相机初始位置 - 中国版图
    STATE.viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(104.1954, 35.8617, 15000000),
      duration: 0
    });
    
    // 相机移动时更新信息
    STATE.viewer.camera.changed.addEventListener(() => {
      updateInfoIndicators();
    });
    

    
    // 点击标记选择电台
    const handler = new Cesium.ScreenSpaceEventHandler(STATE.viewer.scene.canvas);
    handler.setInputAction(movement => {
      const station = getPickedStation(movement.position);
      if (station) selectStation(station);
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    
    // 鼠标移动显示电台信息
    handler.setInputAction(movement => {
      showStationTooltip(movement.endPosition);
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
    
    // 鼠标离开画布隐藏提示框
    handler.setInputAction(() => {
      hideStationTooltip();
    }, Cesium.ScreenSpaceEventType.LEFT_UP);
    
    // 初始化信息
    updateInfoIndicators();
    
  } catch (error) {
    console.error('❌ Cesium 初始化失败:', error);
    document.getElementById('loading-text').textContent = '初始化失败';
    document.getElementById('loading-error').textContent = error.message;
  }
}

async function loadStations() {
  try {
    document.getElementById('loading-text').textContent = '加载电台数据...';
    
    // 首先尝试从API加载
    await loadStationsFromAPI();
    
  } catch (error) {
    console.error('❌ 加载电台失败:', error);
    showToast('⚠️ 电台数据加载失败');
    // 如果API失败，使用本地示例数据
    loadSampleStations();
  }
}

// ================================
// 初始化
// ================================

document.addEventListener('DOMContentLoaded', function() {
  console.log('🚀 Global Radio 启动中...');
  
  // 初始化音频播放器
  initAudioPlayer();
  
  // 初始化 Cesium
  initCesium();
  
  // 加载电台数据
  loadStations();
  
  // 初始化书签
  renderBookmarks();
  
  // 初始化收藏和历史
  renderFavorites();
  renderHistory();
});

// 页面卸载清理 - 防止内存泄漏
window.addEventListener('beforeunload', function() {
  // 停止音频播放
  if (STATE.audio) {
    STATE.audio.pause();
    STATE.audio.src = '';
  }
  // 销毁 HLS 实例
  if (STATE.hls) {
    STATE.hls.destroy();
  }
  // 停止波形动画
  if (waveformAnimationId) {
    cancelAnimationFrame(waveformAnimationId);
  }
  // 清除倒计时
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  // 销毁 Cesium Viewer
  if (STATE.viewer) {
    STATE.viewer.destroy();
  }
});
</script>
